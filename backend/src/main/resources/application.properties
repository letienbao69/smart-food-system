# =========================================
# DATABASE
# =========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_shop?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234567}

spring.datasource.hikari.connection-timeout=30000

# =========================================
# JPA / HIBERNATE
# =========================================
# DDL is managed manually via SQL migration files in src/main/resources/db
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# =========================================
# SERVER
# =========================================
server.address=0.0.0.0
server.port=8080

# =========================================
# JWT
# =========================================
# IMPORTANT: override app.jwt.secret in production with a strong random value via env var
app.jwt.secret=${JWT_SECRET:smart-food-system-default-dev-secret-change-me-in-production-please-2026}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================
# AI (Gemini)
# Get a key at: https://aistudio.google.com/app/apikey
# IMPORTANT: For production, override via env var GEMINI_API_KEY.
# The default below is a dev key for the graduation demo only.
# =========================================
ai.gemini.api-key=${GEMINI_API_KEY:AIzaSyDa4i21crpwROYIqxp4mRGddJNgpub5FjU}
ai.gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Legacy aliases used by some services - same values as above
ai.api.url=${ai.gemini.api-url}
ai.api.key=${ai.gemini.api-key}

# =========================================
# PAYMENT (VietQR demo)
# =========================================
payment.bank-code=${PAYMENT_BANK_CODE:MB}
payment.account-no=${PAYMENT_ACCOUNT_NO:0123456789}

# =========================================
# PAYOS (cổng thanh toán tự động)
# my.payos.vn -> Kênh thanh toán -> lấy 3 khóa dưới đây
# Để bảo mật khi đẩy lên Git, đặt qua biến môi trường:
#   PAYOS_CLIENT_ID, PAYOS_API_KEY, PAYOS_CHECKSUM_KEY
# =========================================
payos.client-id=${PAYOS_CLIENT_ID:83265a77-1e28-4b3f-a1ce-b003be160755}
payos.api-key=${PAYOS_API_KEY:99cf6d92-a7a8-47c6-9a67-ed536403a315}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:8779e6d679fb4fa647e22a32f54424837df0eec9b7eb7bb03417ec75423199fd}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment-success}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment-cancel}

# ── Tự động hủy đặt bàn nếu khách không thanh toán cọc đúng hạn ──
# Thời gian cho phép thanh toán (phút) kể từ khi tạo link PayOS
app.reservation.payment-timeout-minutes=${RESERVATION_PAYMENT_TIMEOUT_MINUTES:3}
# Chu kỳ quét đặt bàn quá hạn (mili-giây)
app.reservation.timeout-check-interval-ms=${RESERVATION_TIMEOUT_CHECK_INTERVAL_MS:20000}
payment.account-name=${PAYMENT_ACCOUNT_NAME:SMART FOOD SHOP}

# =========================================
# RESERVATION (đặt bàn ăn tại nhà hàng)
# Tiền cọc giữ bàn gợi ý trên mỗi khách (VND), trừ vào hóa đơn khi đến ăn.
# =========================================
reservation.deposit-per-guest=${RESERVATION_DEPOSIT_PER_GUEST:50000}

# =========================================
# LOGGING
# =========================================
logging.level.org.springframework.security=INFO
logging.level.com.food.smart_food_system=INFO

# =========================================
# SWAGGER / OPENAPI
# =========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# =========================================
# UPLOAD ẢNH (avatar, ảnh món ăn) lưu cục bộ, phục vụ qua /uploads/**
# =========================================
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB


# =========================================
# MÚI GIỜ — đồng bộ toàn hệ thống về giờ Việt Nam (UTC+7)
# =========================================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# =========================================
# GỬI EMAIL — quên mật khẩu (Gmail SMTP)
# =========================================
# Bật/tắt gửi email thật. Để true khi đã điền username/password bên dưới.
app.mail.enabled=${APP_MAIL_ENABLED:false}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
# Email gửi đi (Gmail của bạn)
spring.mail.username=${MAIL_USERNAME:}
# App Password 16 ký tự (KHÔNG dùng mật khẩu Gmail thường) — tạo tại https://myaccount.google.com/apppasswords
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
